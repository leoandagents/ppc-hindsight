[project]
name = "ppc-hindsight"
version = "0.1.1"
description = "Hindsight audit for Amazon Sponsored Products: what late, missing and wrong keyword decisions actually cost, computed from one console export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ppc-hindsight = "ppc_hindsight.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ppc_hindsight*"]

[tool.setuptools.package-data]
ppc_hindsight = ["*.json"]
